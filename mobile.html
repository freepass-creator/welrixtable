<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>웰릭스 모빌리티 · 신차 장기렌터카 견적</title>
  <meta name="theme-color" content="#e1141e" />
  <meta name="description" content="현대·기아·제네시스 전 차종 신차 장기렌터카 실시간 견적" />
  <!-- Open Graph (카톡/페북/슬랙 등 링크 미리보기) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="웰릭스 모빌리티 · 신차 장기렌터카 견적" />
  <meta property="og:description" content="현대·기아·제네시스 전 차종 실시간 견적" />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="웰릭스 모빌리티" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/og-image.png" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- PWA — 홈 화면에 추가 (앱처럼 설치) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/welrix-icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="웰릭스 견적" />
  <script>
    if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <!-- 차량 DB — PC 와 동일 SSOT -->
  <!-- ★차량 DB = 웰릭스 것 (2026-09-18 대표: 「웰릭스 거 견적기를 그대로 갖다 쓰고」)
       trim_id 가 곧 /api/estimate 의 model 키다 — 이름 매핑이 없다.
       옛 /vehicle-db.js 는 제조사 가격표에 없는 값이라 폐기했다(그 파일 머리 주석 참고). -->
  <script src="/welrix-db.js"></script>
  <!-- 견적서 이미지 캡쳐용 -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- 견적서(official) CSS — PC 와 동일 스타일 (이미지 캡쳐 시 적용) -->
  <link rel="stylesheet" href="/quote-doc.css" />
  <style>
    :root {
      /* 모바일 UI 규격 SSOT — 컴포넌트에서 px를 새로 만들지 않고 이 토큰을 쓴다. */
      --brand: #e1141e;
      --brand-700: #b30f18;
      --brand-100: #f6c4c7;
      --brand-50: #fdecee;
      --ink-1: #0a0a0a;
      --ink-2: #404040;
      --ink-3: #737373;
      --ink-4: #a3a3a3;
      --bg: #ffffff;
      --bg-soft: #fafafa;
      --line: #e5e5e5;
      --line-2: #d4d4d4;

      --r-sm: 4px;
      --r: 6px;
      --r-md: 8px;
      --r-chip: 10px;
      --r-card: 12px;
      --r-sheet: 16px;
      --r-pill: 999px;

      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;

      --h-chip: 36px;
      --h-input: 46px;
      --h-cta: 54px;

      --fs-xs: 11px;
      --fs-sm: 12.5px;
      --fs-md: 13px;
      --fs-base: 14px;
      --fs-lg: 15px;
      --fs-xl: 17px;
      --fs-2xl: 22px;

      --fw-regular: 400;
      --fw-medium: 500;
      --fw-semi: 600;
      --fw-bold: 700;

      /* 레거시 컴포넌트 별칭 — 값은 위 모바일 규격으로 한 곳에서 결정한다. */
      --radius-sm: var(--r-sm);
      --radius: var(--r);
      --radius-md: var(--r-md);
      --radius-lg: var(--r-card);
      --radius-pill: var(--r-pill);
      --space-1: var(--sp-1);
      --space-2: var(--sp-2);
      --space-3: var(--sp-3);
      --space-4: var(--sp-4);
      --space-5: var(--sp-5);
      --space-6: var(--sp-6);
      --space-8: var(--sp-8);

      --safe-top: env(safe-area-inset-top, 0);
      --safe-bottom: env(safe-area-inset-bottom, 0);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--ink-1);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: -0.2px;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
      /* 화면을 당겼다 놓을 때 브라우저 '당겨서 새로고침'으로 견적 데이터가 날아가는 것 방지 */
      overscroll-behavior-y: contain;
    }
    /* 1024px 초과 (PC) 진입 시 데스크탑으로 리다이렉트 — 모바일 페이지인데 PC 로 들어오면 어색
       ★?force=mobile 이면 넘기지 않으므로 이 안내도 띄우지 않는다(html.force-mobile).
         예전엔 넘기기는 멈추고 이 안내만 떠서, PC 로 연 손님 링크가 「PC 버전으로 이동합니다」에 멈춰 있었다. */
    @media (min-width: 1025px) {
      html:not(.force-mobile) body::before {
        content: '데스크탑 환경입니다 — PC 버전으로 이동합니다';
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--ink-3); font-size: 14px;
      }
    }
    #m-app { min-height: 100vh; display: flex; flex-direction: column; }

    /* 폰보다 넓은 화면(태블릿·PC) — 견적기를 폰 폭 기둥으로 가운데 모은다.
       고정된 줄(헤더·진행바·금액바·아래 버튼)은 left:0; right:0 이라 max-width + margin:auto 로 가운데 온다.
       html 을 앞에 붙인 건 컴포넌트 scoped 스타일보다 세게 먹이려는 것이다. */
    @media (min-width: 561px) {
      html body { background: #f1f2f4; }
      html #m-app, html .m-header, html .m-progress, html .m-footer, html .sq {
        max-width: 480px; margin-left: auto; margin-right: auto;
      }
      html #m-app { background: var(--bg); }
    }

    /* 진입 게이트 */
    .gate-bg {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #f7f7f7, #eef4fa);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }
    .gate-card {
      width: 100%; max-width: 360px;
      background: #fff;
      border-radius: 16px;
      padding: 36px 28px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      text-align: center;
    }
    .gate-ci { height: 24px; width: auto; margin-bottom: 20px; }
    .gate-title { font-size: 18px; font-weight: 700; color: var(--ink-1); margin: 0 0 6px; letter-spacing: -0.3px; }
    .gate-sub { font-size: 13px; color: var(--ink-3); margin: 0 0 22px; }
    #gate-pin {
      width: 100%; height: 50px;
      padding: 0 16px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-family: inherit; font-size: 22px;
      text-align: center; letter-spacing: 12px;
      color: var(--ink-1); outline: none;
      font-variant-numeric: tabular-nums;
      transition: border-color .12s;
    }
    #gate-pin:focus { border-color: var(--brand); }
    #gate-err {
      margin-top: 10px; padding: 8px 12px;
      background: #fff1f1; color: #c62828;
      border-radius: 6px; font-size: 12.5px;
    }
    #gate-submit {
      width: 100%; height: 50px; margin-top: 14px;
      background: var(--brand); color: #fff;
      border: 0; border-radius: 10px;
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    #gate-submit:active { background: var(--brand-700); }
    #gate-admin {
      width: 100%; height: 38px; margin-top: 8px;
      background: transparent; color: var(--ink-3);
      border: 0; border-radius: 8px;
      font-family: inherit; font-size: 12.5px; font-weight: 500;
      cursor: pointer;
    }
    #gate-admin:active { background: var(--bg-soft); color: var(--ink-1); }
  </style>
  <script>
    // PC viewport 로 들어오면 데스크탑 페이지로 redirect (단, ?force=mobile 이면 유지)
    (function () {
      const params = new URLSearchParams(location.search);
      if (params.get('force') === 'mobile') { document.documentElement.classList.add('force-mobile'); return; }
      if (window.innerWidth > 1024) {
        const target = location.pathname.replace(/mobile\.html$/, 'index.html');
        location.replace(target + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
<!-- ★역할은 src/lib/role.js 가 정한다. 기본은 «손님».
     예전엔 여기서 sessionStorage 에 'agent' 를 박아 «늘 담당자»로 열었는데,
     그 값을 읽는 데가 한 군데도 없어 껍데기였다. 걷어냈다. -->
  <div id="m-app"></div>
  <script type="module" src="/src/mobile.js"></script>
</body>
</html>
